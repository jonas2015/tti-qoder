# Render.com Blueprint
# Deploy both backend and frontend services

services:
  # Backend API Service (Java/Spring Boot)
  - type: web
    name: tti-backend
    env: java
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: mvn package -DskipTests
    startCommand: java -jar target/tti-backend-1.0.0.jar
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: JAVA_OPTS
        value: -Xmx512m

  # Frontend Static Site (can be deployed to Vercel for better performance)
  - type: web
    name: tti-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
