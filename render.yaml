# Render.com Blueprint
# Deploy both backend and frontend services using Docker

services:
  # Backend API Service (Java/Spring Boot)
  - type: web
    name: tti-backend
    env: docker
    region: oregon
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: JAVA_OPTS
        value: -Xmx512m

  # Frontend Static Site (Nginx + Docker)
  - type: web
    name: tti-frontend
    env: docker
    region: oregon
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: VITE_API_URL
        value: https://tti-backend.onrender.com/api
